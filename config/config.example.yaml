# gmailification configuration — copy to config/config.yaml and edit,
# or start with just "users: []" and configure everything in the web UI.
# config/config.yaml is gitignored: it contains your account layout (not
# secrets; those live in .env / mounted files) but there is no reason to
# publish it.

poll_interval_seconds: 180      # how often to check the sources
alert_after_hours: 6            # alert when a source has been failing this long
realert_after_hours: 24         # repeat the alert while still failing
http_bind: 0.0.0.0              # LAN web interface
http_port: 8377
oauth_client_file: /config/client_secret.json
db_path: /data/gmailification.db
heartbeat_file: /data/heartbeat
secrets_dir: /data/secrets      # passwords entered in the web UI land here (0600)
history_days: 14                # how long to keep per-poll history for the UI charts

# Be a polite citizen on a shared broadband line. These are the global
# defaults; any source can override any subset with its own throttle: block
# (handy for a large one-off archive import — see the README).
throttle:
  bandwidth_limit_kbps: 0       # 0 = unlimited; e.g. 512 to cap at ~0.5 MB/s
  max_messages_per_cycle: 200   # per source per cycle; the rest follow next cycle
  message_pause_seconds: 0      # fixed extra pause between messages

admin:
  user: alice                   # receives copies of alerts + OAuth-broken alerts
  copy_alerts: true

users:
  - name: alice
    destination:
      email: alice@gmail.com
      token_file: /data/tokens/alice.json
    sources:
      - name: old-company
        host: imap.gmail.com          # a Google-hosted mailbox, via app password
        username: alice@old-company.example
        password_env: GMAILIFICATION_SRC_ALICE_OLD_COMPANY
        label: Pulled/old-company
        # folders: [INBOX]            # default; each entry is a name or a mapping:
        # folders:
        #   - INBOX
        #   - name: "[Gmail]/Sent Mail"
        #     place: sent             # lands in Gmail's Sent view: read, threaded,
        #                             # never in the inbox (place: inbox | sent | archive)
        #     # label: Pulled/old-company/sent   # optional per-folder label override
        # backfill_days: 7            # import the last N days on first run (default 0)
        # after_import: keep          # keep (default) = copy, source untouched;
        #                             # delete = move, expunge from the source
        #                             # after a confirmed import into Gmail
      - name: isp
        host: imap.isp.example        # a plain-IMAP mailbox
        username: alice@isp.example
        password_env: GMAILIFICATION_SRC_ALICE_ISP
        label: Pulled/isp
        # throttle:                   # per-source override; unset fields inherit
        #   max_messages_per_cycle: 100   # e.g. gentler pace for a big backfill
        #   bandwidth_limit_kbps: 512

  - name: bob
    destination:
      email: bob@gmail.com
      token_file: /data/tokens/bob.json
    sources:
      - name: club
        host: mail.association.example
        username: info@association.example
        password_env: GMAILIFICATION_SRC_BOB_CLUB
        label: Pulled/club
